name: Cypherium
description: >-
  Cypherium is a permissionless Layer-1 blockchain built to bridge centralized (CeFi) and
  decentralized (DeFi) finance and bring real-world assets on-chain at scale. It runs CypherBFT,
  a hybrid consensus that pairs GPU proof-of-work committee election with HotStuff Byzantine
  Fault Tolerance for near-instant finality, and is EVM/Solidity compatible (EVM chain ID 16166).
  Products include CypherLink (cross-ledger notary), Cypherium Connect (bank integration plugin,
  marketed as ISO 20022 compliant), the Cypherium Validator, and Cypherium ID (decentralized
  identity). Developers integrate through an Ethereum-style JSON-RPC node API (eth/web3/net/
  personal/miner/txpool/admin namespaces over HTTP, WS and IPC) and a Coinbase Rosetta API
  implementation for exchange and wallet integration. Surfaced as a portfolio company of
  Pantera Capital and enriched into the API Evangelist network.
